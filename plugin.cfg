[plugin]

name="mcp-sh-godot"
description="Lets the mcp-sh-godot agent shell run editor commands (github.com/brohd11/mcp-sh-godot). Bundles everything it needs. Installed and updated by `mcp-sh-godot addon install`."
author="brohd"
version="0.1.5"
minimum_engine_version="4.4"
script="plugin.gd"
require=[
"brohd11/godot-mcp-sh-bridge@v0.1.3",
"brohd11/godot-gdsh@v0.4.5",
"brohd11/godot-gdsh-lib-tree@v0.2.3",
"brohd11/godot-gdsh-lib-utils@v0.3.3",
"brohd11/godot-gdsh-lib-editor@v0.1.3",
]

path="addons/mcp_sh_godot"
url="https://github.com/brohd11/godot-mcp-sh-plugin.git"
