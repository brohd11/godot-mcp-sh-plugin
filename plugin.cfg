[plugin]

name="mcp-sh-godot"
description="Lets the mcp-sh-godot agent shell run editor commands (github.com/brohd11/mcp-sh-godot). Bundles everything it needs. Installed and updated by `mcp_sh_godot plugin install`."
author="brohd"
version="0.2.2"
minimum_engine_version="4.4"
script="plugin.gd"
require=[
"brohd11/godot-mcp-sh-bridge@v0.1.4",
"brohd11/godot-gdsh@v0.5.3",
"brohd11/godot-gdsh-lib-tree@v0.3.2",
"brohd11/godot-gdsh-lib-utils@v0.4.3",
"brohd11/godot-gdsh-lib-editor@v0.2.2",
]

path="addons/mcp_sh_godot"
url="https://github.com/brohd11/godot-mcp-sh-plugin.git"
