export_root: "res://addons/mcp_sh_godot/_export_ignore/exports"
plugin_folder: "McpShGodot{{version=res://addons/mcp_sh_godot}}"
pre_script: ""
post_script: ""
# Everything it uses is bundled, so installers need nothing beside it.
exported_require: []
options:
  overwrite: true
  include_uid: true
  include_import: true
  ignore_src: false
  use_tag_in_cfg: true
  include_min_version: true
  move_global_files: false
  include_docs: true
  include_project_license: false
  parser_settings:
    use_relative_paths: false
    backport_target: 100
    parse_cs:
      namespace_rename: {}
    parse_gd:
      replace_editor_interface: false
      optimizer:
        struct_mode: tagged
        inline_mode: tagged
        aggressive: false
        debug_tags: false
        enabled: false
      class_rename_ignore: []
      backport_string_renames: {}
    parse_tscn: {}
    parse_tres: {}
exports:
  -
    source: "res://addons/mcp_sh_godot"
    export_name: "mcp-sh-godot-plugin{{version=res://addons/mcp_sh_godot}}"
    export_folder: addons/mcp_sh_godot
